



<!DOCTYPE html>
<html>
<head>
    <title>Password Strength Analyzer</title>

    <style>
        body {
            background: #ffe4ec;
            color: #831843;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }

        .box {
            background: #ffc1d6;
            padding: 25px;
            width: 350px;
            max-width: 90%;
            margin: auto;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(219, 39, 110, 0.2);
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border-radius: 10px;
            border: 2px solid #f48fb1;
            background: #fff0f6;
            color: #831843;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: #e91e63;
        }

        button {
            padding: 10px 15px;
            margin: 8px;
            background: #e91e63;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #c2185b;
            transform: scale(1.05);
        }

        #bar {
            height: 10px;
            background: gray;
            width: 0%;
            border-radius: 10px;
            margin-top: 15px;
            transition: 0.3s;
        }

        #message {
            font-weight: bold;
            margin: 15px;
            color: #9d174d;
        }

        ul {
            text-align: left;
        }

        #suggestions {
            background: #ffeaf2;
            color: #831843;
            padding: 12px;
            border-radius: 12px;
            text-align: left;
            margin-top: 15px;
        }

        #suggestions h3 {
            color: #d81b60;
        }

        #suggestions li {
            margin: 8px 0;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>🔐 Password Security Tool</h2>

        <input type="password" id="password"
        placeholder="Enter your password">

        <button onclick="togglePassword()">Show / Hide</button>

        <div id="bar"></div>

        <p id="message">Password strength will appear here</p>

        <ul>
            <li id="upper">❌ Uppercase letter</li>
            <li id="lower">❌ Lowercase letter</li>
            <li id="number">❌ Number</li>
            <li id="special">❌ Special character</li>
            <li id="length">❌ At least 12 characters</li>
        </ul>

        <div id="suggestions">
            <h3>💡 Password Suggestions</h3>
            <ul id="suggestionList">
                <li>Enter a password to get suggestions.</li>
            </ul>
        </div>

        <button onclick="generatePassword()">Generate Password</button>

        <button onclick="copyPassword()">Copy Password</button>

    </div>

    <script>

        let passwordInput = document.getElementById("password");

        passwordInput.addEventListener("input", checkPassword);

        function checkPassword() {

            let password = passwordInput.value;

            let hasUpper = /[A-Z]/.test(password);
            let hasLower = /[a-z]/.test(password);
            let hasNumber = /[0-9]/.test(password);
            let hasSpecial = /[^A-Za-z0-9]/.test(password);
            let hasLength = password.length >= 12;

            document.getElementById("upper").innerHTML =
                (hasUpper ? "✅" : "❌") + " Uppercase letter";

            document.getElementById("lower").innerHTML =
                (hasLower ? "✅" : "❌") + " Lowercase letter";

            document.getElementById("number").innerHTML =
                (hasNumber ? "✅" : "❌") + " Number";

            document.getElementById("special").innerHTML =
                (hasSpecial ? "✅" : "❌") + " Special character";

            document.getElementById("length").innerHTML =
                (hasLength ? "✅" : "❌") + " At least 12 characters";

            let score = 0;

            if (hasUpper) score++;
            if (hasLower) score++;
            if (hasNumber) score++;
            if (hasSpecial) score++;
            if (hasLength) score++;

            let message = document.getElementById("message");
            let bar = document.getElementById("bar");

            if (password.length === 0) {

                message.innerHTML = "Enter a password";
                bar.style.width = "0%";
                bar.style.background = "gray";

            }
            else if (score <= 2) {

                message.innerHTML = "Weak Password";
                bar.style.width = "30%";
                bar.style.background = "#ff4d6d";

            }
            else if (score <= 4) {

                message.innerHTML = "Medium Password";
                bar.style.width = "65%";
                bar.style.background = "#ff9f43";

            }
            else {

                message.innerHTML = "Strong Password";
                bar.style.width = "100%";
                bar.style.background = "#db2777";

            }

            showSuggestions(
                hasUpper,
                hasLower,
                hasNumber,
                hasSpecial,
                hasLength,
                password
            );

        }

        function showSuggestions(
            hasUpper,
            hasLower,
            hasNumber,
            hasSpecial,
            hasLength,
            password
        ) {

            let suggestions = [];

            if (password === "") {
                suggestions.push("Enter a password to analyze it.");
            }
            else {

                if (!hasUpper)
                    suggestions.push("Add at least one uppercase letter (A-Z).");

                if (!hasLower)
                    suggestions.push("Add at least one lowercase letter (a-z).");

                if (!hasNumber)
                    suggestions.push("Include at least one number (0-9).");

                if (!hasSpecial)
                    suggestions.push("Add a special symbol like !, @, #, or $.");

                if (!hasLength)
                    suggestions.push("Make your password at least 12 characters long.");

                if (password.length < 16)
                    suggestions.push("Consider making it longer for better security.");

                if (/^(123|abc|password|qwerty)/i.test(password))
                    suggestions.push("Avoid common words or predictable sequences.");

                if (suggestions.length === 0)
                    suggestions.push("Great! All basic password requirements are met.");
            }

            let list = document.getElementById("suggestionList");

            list.innerHTML = "";

            for (let suggestion of suggestions) {

                let li = document.createElement("li");
                li.textContent = suggestion;
                list.appendChild(li);

            }

        }

        function generatePassword() {

            let characters =
                "ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
                "abcdefghijklmnopqrstuvwxyz" +
                "0123456789!@#$%^&*";

            let password = "";

            let randomValues = new Uint32Array(16);
            crypto.getRandomValues(randomValues);

            for (let i = 0; i < 16; i++) {

                let index = randomValues[i] % characters.length;
                password += characters[index];

            }

            passwordInput.value = password;

            checkPassword();

        }

        function togglePassword() {

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
            }
            else {
                passwordInput.type = "password";
            }

        }

        async function copyPassword() {

            let password = passwordInput.value;

            if (password === "") {
                alert("Generate or enter a password first!");
                return;
            }

            try {

                await navigator.clipboard.writeText(password);
                alert("Password copied!");

            }
            catch (error) {

                alert("Copy failed. Please copy it manually.");

            }

        }

    </script>

</body>
</html>
