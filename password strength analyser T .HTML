
<!DOCTYPE html>
<html>
<head>
    <title>Password Strength Analyzer</title>
    <style>
        body {
            background: #ffe4ec;
            color: #831843;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }

        .box {
            background: #ffc1d6;
            padding: 25px;
            width: 350px;
            max-width: 90%;
            margin: auto;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(219, 39, 110, 0.2);
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border-radius: 10px;
            border: 2px solid #f48fb1;
            background: #fff0f6;
            color: #831843;
            box-sizing: border-box;
            outline: none;
        }

        button {
            background: #db2777;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1> Password Strength Analyzer</h1>

    <div class="box">
        <h2>Check Your Password</h2>

        <input type="password" id="password"
        placeholder="Enter your password">

        <br>

        <button onclick="checkPassword()">
            Analyze Password
        </button>

        <p id="result"></p>
    </div>

    <script>
        function checkPassword() {
            let password =
                document.getElementById("password").value;

            let result =
                document.getElementById("result");

            let score = 0;

            if (password.length >= 8) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[a-z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;

            if (password.length === 0) {
                result.innerHTML = "Please enter a password!";
            }
            else if (score <= 2) {
                result.innerHTML = "Weak Password 🔴";
            }
            else if (score <= 4) {
                result.innerHTML = "Medium Password 🟡";
            }
            else {
                result.innerHTML = "Strong Password 🟢";
            }
        }
    </script>

</body>
</html>
