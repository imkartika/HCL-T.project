
<!DOCTYPE html>
<html>
<head>
    <title>Password Strength Analyzer</title>

    <style>
        body {
            background-color: #ffd6e7;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
        }

        .box {
            background-color: #fff0f6;
            width: 380px;
            max-width: 90%;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0px 0px 15px pink;
        }

        h1 {
            color: #d63384;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: 2px solid pink;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            background-color: #e75497;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
        }

        button:hover {
            background-color: #c21868;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }

        .meter {
            background-color: #f8c8dc;
            border-radius: 10px;
            margin-top: 10px;
            height: 12px;
        }

        #bar {
            height: 12px;
            width: 0%;
            background-color: pink;
            border-radius: 10px;
            transition: 0.4s;
        }

        .suggestions {
            background-color: #ffe0ed;
            margin-top: 20px;
            padding: 15px;
            border-radius: 15px;
            text-align: left;
        }

        .suggestions h3 {
            color: #c21868;
            text-align: center;
        }

        .suggestions p {
            color: #7d3155;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>💗 Password Analyzer 💗</h1>

        <p>Enter your password to check its strength</p>

        <input type="password" id="password"
        placeholder="Enter password here"
        oninput="checkPassword()">

        <button onclick="togglePassword()">Show / Hide</button>

        <div class="meter">
            <div id="bar"></div>
        </div>

        <p id="result">Password strength will appear here</p>

        <!-- Suggestions Section -->
        <div class="suggestions">
            <h3>💡 Suggestions to Improve</h3>
            <div id="suggestions">
                <p>✨ Enter a password to get suggestions.</p>
            </div>
        </div>

    </div>

    <script>

        function checkPassword() {

            let password = document.getElementById("password").value;
            let score = 0;
            let suggestions = [];

            let result = document.getElementById("result");
            let bar = document.getElementById("bar");
            let suggestionBox = document.getElementById("suggestions");

            // Check password length
            if (password.length >= 12) {
                score++;
            } else {
                suggestions.push("➕ Use at least 12 characters.");
            }

            // Check uppercase letters
            if (/[A-Z]/.test(password)) {
                score++;
            } else {
                suggestions.push("🔠 Add an uppercase letter (A-Z).");
            }

            // Check lowercase letters
            if (/[a-z]/.test(password)) {
                score++;
            } else {
                suggestions.push("🔡 Add a lowercase letter (a-z).");
            }

            // Check numbers
            if (/[0-9]/.test(password)) {
                score++;
            } else {
                suggestions.push("🔢 Add a number (0-9).");
            }

            // Check special characters
            if (/[^A-Za-z0-9]/.test(password)) {
                score++;
            } else {
                suggestions.push("✨ Add a special character (!, @, #, $, %).");
            }

            // Empty password
            if (password.length === 0) {
                result.innerHTML = "Password strength will appear here";
                result.style.color = "#d63384";
                bar.style.width = "0%";
                suggestionBox.innerHTML = "<p>✨ Enter a password to get suggestions.</p>";
                return;
            }

            // Password strength
            if (score <= 2) {
                result.innerHTML = "🔴 Weak Password";
                result.style.color = "red";
                bar.style.width = "30%";
                bar.style.backgroundColor = "red";
            }

            else if (score <= 4) {
                result.innerHTML = "🟠 Moderate Password";
                result.style.color = "orange";
                bar.style.width = "65%";
                bar.style.backgroundColor = "orange";
            }

            else {
                result.innerHTML = "🟢 Strong Password";
                result.style.color = "green";
                bar.style.width = "100%";
                bar.style.backgroundColor = "green";
            }

            // Show suggestions
            if (suggestions.length === 0) {
                suggestionBox.innerHTML =
                    "<p>🎉 Excellent! Your password meets all the checks.</p>";
            } else {
                suggestionBox.innerHTML = "";

                for (let i = 0; i < suggestions.length; i++) {
                    suggestionBox.innerHTML += "<p>" + suggestions[i] + "</p>";
                }
            }
        }

        // Show / Hide Password
        function togglePassword() {

            let input = document.getElementById("password");

            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }

    </script>

</body>
</html>
